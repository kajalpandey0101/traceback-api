version: '3.9'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: traceback
      POSTGRES_USER: traceback
      POSTGRES_PASSWORD: traceback
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    command: celery -A traceback_api worker -l info
    env_file:
      - .env.example
    depends_on:
      - redis

  celery_beat:
    build: .
    command: celery -A traceback_api beat -l info
    env_file:
      - .env.example
    depends_on:
      - redis
